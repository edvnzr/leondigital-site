<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Doc Gen feedback</title>
<meta name="description" content="Send feedback, ideas or problems about Doc Gen to Leon Digital.">
<link rel="icon" href="brand/logo.png">
<style>
:root{
  --navy:#0A0F2E; --blue:#1667F2;
  --bg:#F6F8FE; --surface:#FFFFFF; --text:#0E1430; --muted:#535B78;
  --line:#E2E7F5; --accent:var(--blue); --error:#C62828; --ok:#1B7F4B;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#060A22; --surface:#0E1438; --text:#EEF1FF; --muted:#A3AAC8;
    --line:#1D2550; --accent:#4D8BFF; --error:#FF8A80; --ok:#6FDCA1;}
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);
  font:16px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
a{color:var(--accent)}
.wrap{max-width:720px;margin:0 auto;padding:0 20px}
header{padding:20px 0}
.brand{display:inline-flex;align-items:center;gap:10px;font-weight:800;font-size:1.15rem;
  color:var(--text);text-decoration:none;white-space:nowrap}
.brand img{width:36px;height:36px;border-radius:9px;background:var(--navy)}
.brand span{color:var(--accent)}
h1{font-size:clamp(1.8rem,4.5vw,2.4rem);letter-spacing:-.02em;margin:24px 0 8px}
.lead{color:var(--muted);margin:0 0 24px}
form{background:var(--surface);border:1px solid var(--line);border-radius:24px;padding:24px}
label{display:block;font-weight:600;margin:0 0 6px}
.hint{font-weight:400;color:var(--muted)}
input,textarea{width:100%;font:inherit;color:var(--text);background:transparent;
  border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin:0 0 18px}
input:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:1px;border-color:transparent}
textarea{min-height:160px;resize:vertical}
.row{display:grid;grid-template-columns:1fr 1fr;gap:0 16px}
.hp{position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden}
button{font:inherit;font-weight:700;border:0;border-radius:999px;padding:12px 24px;
  background:var(--accent);color:#fff;cursor:pointer}
button:disabled{opacity:.5;cursor:default}
#status{margin:14px 0 0;min-height:1.6em}
#status.error{color:var(--error)} #status.ok{color:var(--ok)}
.small{color:var(--muted);font-size:.9rem;margin:20px 0 0}
footer{padding:32px 0 40px;color:var(--muted);font-size:.9rem}
footer a{color:var(--muted)}
@media (max-width:560px){ .row{grid-template-columns:1fr} form{padding:20px} }
</style>
</head>
<body>
<header><div class="wrap">
  <a class="brand" href="/"><img src="brand/logo.png" alt="" width="36" height="36">Leon <span>Digital</span></a>
</div></header>

<main class="wrap">
  <h1>Doc Gen feedback</h1>
  <p class="lead">Ideas, problems or anything that could work better. Every message is read.</p>

  <form id="feedback" novalidate>
    <label for="message">Your feedback</label>
    <textarea id="message" name="message" required maxlength="5000"
      placeholder="What happened, or what would you like to see?"></textarea>
    <div class="row">
      <div>
        <label for="name">Name <span class="hint">(optional)</span></label>
        <input id="name" name="name" autocomplete="name" maxlength="100">
      </div>
      <div>
        <label for="email">Email <span class="hint">(optional, for a reply)</span></label>
        <input id="email" name="email" type="email" autocomplete="email" maxlength="200">
      </div>
    </div>
    <div class="hp" aria-hidden="true">
      <label for="website">Leave this empty</label>
      <input id="website" name="website" tabindex="-1" autocomplete="off">
    </div>
    <button id="send" type="submit">Send feedback</button>
    <p id="status" role="status"></p>
  </form>

  <p class="small">Your message and email are only used to reply to you. See the
    <a href="https://docgen.leondigital.fyi/privacy.html">privacy policy</a>.
    You can also email <a href="mailto:support@leondigital.fyi">support@leondigital.fyi</a>.</p>
</main>

<footer><div class="wrap">© 2026 Leon Digital · <a href="/">leondigital.fyi</a></div></footer>

<script>
(function () {
  var ENDPOINT = 'https://cvzzxbxkymdlmmhyyqlq.supabase.co/functions/v1/feedback';
  var form = document.getElementById('feedback');
  var status = document.getElementById('status');
  var send = document.getElementById('send');
  function say(text, kind) { status.textContent = text; status.className = kind || ''; }

  form.addEventListener('submit', async function (e) {
    e.preventDefault();
    var message = form.message.value.trim();
    var email = form.email.value.trim();
    if (message.length < 3) { say('Please write your feedback first.', 'error'); return; }
    if (email && !/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) {
      say('Please check your email address.', 'error'); return;
    }
    send.disabled = true;
    say('Sending…');
    try {
      var r = await fetch(ENDPOINT, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          message: message, email: email, name: form.name.value.trim(),
          website: form.website.value, source: 'web'
        })
      });
      if (r.ok) {
        form.reset();
        say('Thank you! Your feedback has been sent.', 'ok');
      } else if (r.status === 429) {
        say('Too many messages for now. Please try again later.', 'error');
      } else {
        say('Could not send. Please email support@leondigital.fyi instead.', 'error');
      }
    } catch (err) {
      say('Could not send. Check your connection and try again.', 'error');
    } finally {
      send.disabled = false;
    }
  });
})();
</script>
</body>
</html>
